[package]
name = "github-network-ninja-desktop"
version = "0.1.0"
description = "Local GitHub Network graph viewer"
authors = ["lucienlmy"]
edition = "2021"

[lib]
name = "github_network_ninja_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
